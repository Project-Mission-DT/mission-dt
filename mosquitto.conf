# Mosquitto configuration of the paper experiments (E1 to E5 and the
# publication-rate measurement); run_e7.py writes the same settings for the
# ground-station broker of E6.
# set_tcp_nodelay disables Nagle's algorithm on the broker sockets; with the
# default (false), Linux delays small MQTT messages by about 40 ms.
listener 1883 127.0.0.1
allow_anonymous true
set_tcp_nodelay true
